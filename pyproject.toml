[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyliferisk"
version = "1.13.0"
description = "A python library for life actuarial calculations, simple, powerful and easy-to-use"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Francisco Garate", email = "fgaratesantiago@gmail.com" },
]
keywords = ["actuarial", "life insurance", "mortality tables", "annuity", "risk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/franciscogarate/pyliferisk"
Repository = "https://github.com/franciscogarate/pyliferisk"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["pyliferisk"]
